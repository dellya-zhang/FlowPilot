[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "agent-backend-platform"
version = "0.1.0"
description = "Local-first marketing workflow and customer support Agent workbench"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0,<3", "aiosqlite>=0.20,<1", "asyncpg>=0.30,<1",
  "langgraph>=0.3,<2", "httpx>=0.27,<1", "redis>=5,<7",
  "filelock>=3.20,<4", "boto3>=1.35,<2", "python-multipart>=0.0.18,<1"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
[tool.ruff]
line-length = 110
