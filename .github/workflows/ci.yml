name: CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - run: pytest -q
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]' playwright
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/browser_runtime.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-runtime
          path: browser-evidence/
  vue:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
        working-directory: client
      - run: npm run check && npm run build
        working-directory: client
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]' playwright
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/browser_vue.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vue-browser-evidence
          path: vue-evidence/
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install httpx
      - run: docker compose up --build -d
      - run: python scripts/check_compose.py
      - run: docker compose logs --no-color
        if: failure()
      - run: docker compose down -v
        if: always()
  quick-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install httpx
      - run: docker compose -p flowpilot-quick -f compose.quick.yml up --build -d --wait
      - run: python scripts/check_compose.py
      - run: curl -fsS http://127.0.0.1:8000/console/ | grep -q 'FlowPilot'
      - run: docker compose -p flowpilot-quick -f compose.quick.yml logs --no-color
        if: failure()
      - run: docker compose -p flowpilot-quick -f compose.quick.yml down -v
        if: always()
