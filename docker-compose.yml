services:
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      ACCESS_TOKEN: ${ACCESS_TOKEN:-}
      DATABASE_URL: postgresql+asyncpg://agent:agentpassword@postgres:5432/agent
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      LLM_MAX_CALLS: ${LLM_MAX_CALLS:-18}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-600}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      SUPPORT_TIMEOUT_SECONDS: ${SUPPORT_TIMEOUT_SECONDS:-90}
      LLM_BUDGET_CNY: ${LLM_BUDGET_CNY:-10}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: flowpilot
      CLICKHOUSE_USER: flowpilot
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-flowpilot_local}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: demoaccess
      S3_SECRET_KEY: demosecret
      S3_BUCKET: agent-artifacts
    volumes: ["llm_audit:/code/artifacts"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      minio: {condition: service_started}
      clickhouse: {condition: service_healthy}
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: agent, POSTGRES_PASSWORD: agentpassword, POSTGRES_DB: agent}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 3s
      retries: 20
  redis:
    image: redis:7-alpine
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_DB: flowpilot
      CLICKHOUSE_USER: flowpilot
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-flowpilot_local}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes: ["chdata:/var/lib/clickhouse"]
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "flowpilot", "--password", "${CLICKHOUSE_PASSWORD:-flowpilot_local}", "--query", "SELECT 1"]
      interval: 5s
      start_period: 30s
      retries: 30
  minio:
    # Maintained MinIO-compatible distribution; the original Docker Hub image is gone.
    image: ${S3_IMAGE:-docker.io/pgsty/silo:RELEASE.2026-11-12T00-00-00Z}
    command: server /data --console-address ":9001"
    environment: {MINIO_ROOT_USER: demoaccess, MINIO_ROOT_PASSWORD: demosecret}
    volumes: ["miniodata:/data"]
volumes:
  llm_audit:
  pgdata:
  miniodata:
  chdata:
