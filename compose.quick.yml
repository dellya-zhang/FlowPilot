# One-container preview: real API + SQL + LangGraph + Vue; no external data services.
services:
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      DATABASE_URL: sqlite+aiosqlite:////code/artifacts/flowpilot-quick.db
      ARTIFACT_DIR: /code/artifacts
      LLM_AUDIT_PATH: /code/artifacts/llm-usage.jsonl
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-600}
      LLM_MAX_CALLS: ${LLM_MAX_CALLS:-18}
      LLM_BUDGET_CNY: ${LLM_BUDGET_CNY:-10}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      SUPPORT_TIMEOUT_SECONDS: ${SUPPORT_TIMEOUT_SECONDS:-90}
      ACCESS_TOKEN: ${ACCESS_TOKEN:-}
    volumes:
      - quick_data:/code/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).close()"]
      interval: 3s
      timeout: 5s
      start_period: 10s
      retries: 30
volumes:
  quick_data:
